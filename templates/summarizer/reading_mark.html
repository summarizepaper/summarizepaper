{% load i18n static_version %}{% if show %}<form method="post" action="/{{ LANGUAGE_CODE }}/history/mark/" class="reading-mark{% if full %} reading-mark-full{% endif %}" data-reading-mark>{% csrf_token %}<input type="hidden" name="arxiv_id" value="{{ arxiv_id }}"><input type="hidden" name="title" value="{{ title }}"><input type="hidden" name="next" value="{{ next }}">{% for key, label in labels %}<button type="submit" name="status" value="{% if current == key %}{% else %}{{ key }}{% endif %}" data-status="{{ key }}" aria-pressed="{% if current == key %}true{% else %}false{% endif %}">{% if not full %}<i class="fas fa-bookmark" aria-hidden="true"></i> {% endif %}{{ label }}</button>{% endfor %}{% if full %} <a href="/{{ LANGUAGE_CODE }}/history/?tab=readings&amp;status=to_read">{% trans 'My reading list' %}</a>{% endif %}</form><script defer src="{% static_v 'summarizer/js/reading-mark.js' %}"></script>{% endif %}
