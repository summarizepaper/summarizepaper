{% load i18n %}<div class="tool-row" data-zotero-fill data-target="{{ target }}" data-n="{{ n }}" data-separator="{{ separator }}"
     data-loading="{% trans 'Loading…' %}" data-unavailable="{% trans 'Zotero is not reachable right now. Try again in a moment.' %}"
     data-empty="{% trans 'Your Zotero library has no collection.' %}" data-setup="{% trans 'Connect your Zotero library first.' %}"
     data-filled="{% trans '%(n)s papers added, the last added to Zotero first.' %}" data-none="{% trans 'No paper of this collection has a DOI or an arXiv identifier.' %}">
  <button type="button" class="btn btn-sm btn-ghost">{% trans 'Take them from a Zotero collection' %}</button>
  <select hidden aria-label="{% trans 'Zotero collection' %}"></select>
  <span class="tool-status" aria-live="polite"></span>
</div>
