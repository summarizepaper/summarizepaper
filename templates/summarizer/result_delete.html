{% load i18n %}{# The owner's button to delete one of their results (removal.py), then go back to the tool's page. Expects row and tool (the tool's path under /<lang>/). #}
{% if not row.running %}<form method="post" action="{% url 'delete' 'results' %}" class="result-delete" data-confirm="{% trans 'Delete this result? Its shared link stops working. You can restore it from the trash of your dashboard for 30 days.' %}" onsubmit="return window.confirm(this.dataset.confirm)">{% csrf_token %}<input type="hidden" name="next" value="/{{ LANGUAGE_CODE }}/{{ tool }}/"><button type="submit" name="one" value="{{ row.pk }}" class="link-button delete-button">{% trans 'Delete this result' %}</button></form>{% endif %}
